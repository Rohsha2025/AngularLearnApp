<main >
  <div >

    <h1>Welcome to Counter app!</h1>

    <div>
      <h2>The current count is: {{ count() }}</h2>
      <br>
      <h4> To increase count :</h4>
      <button (click)="operation('add')">Increment</button>
      <br>
      <h4> To decrease count :</h4>
      <button (click)="operation('subtract')">Decrement</button>
      <br>
      <h4> To reset count :</h4>
      <button (click)="operation('reset')">Reset</button>
    </div>


  </div>

</main>
