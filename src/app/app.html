

<main >
  <div >

    <h1>Hello, {{ title() }}</h1>
    <br>
    <h2>Name: {{ name }}</h2>
    <h2>Age: {{ age }}</h2>
    <h3>Name from function: {{ getName() }}</h3>

    <h3> Basic calculation using interpolation : {{10+20}}</h3>
    <br>
    <h3> Basic calculation using interpolation and ts file : {{getValue(10, 20,30)}}</h3>

    <h4>We can use inline interpolation in the template</h4>

    <!-- call function -->
    <button (click)="getName()">Get Name</button>

  </div>

  </main>
